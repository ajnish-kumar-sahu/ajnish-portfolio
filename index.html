    <link rel="preload" href="/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
    
    <title>Ajnish Kumar - BCA Student & Developer</title>
    
    <!-- Critical CSS for preventing FOUC -->
    <style>
      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        line-height: 1.7;
        margin: 0;
        padding: 0;
      }
      
      /* Premium Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #030712; /* Slate 950 */
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .loading-spinner {
        width: 64px;
        height: 64px;
        position: relative;
        animation: spin 3s infinite linear;
      }

      .loading-spinner::before,
      .loading-spinner::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
      }

      .loading-spinner::before {
        border-top-color: #3b82f6; /* blue-500 */
        border-right-color: #8b5cf6; /* purple-500 */
        animation: spin-pulse 1.5s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .loading-spinner::after {
        border-bottom-color: #ec4899; /* pink-500 */
        border-left-color: #10b981; /* emerald-500 */
        animation: spin-pulse 2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55) reverse;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes spin-pulse {
        0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
        50% { transform: rotate(180deg) scale(1.1); opacity: 1; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        100% { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
      }

      .loading-text {
        font-family: 'Syne', system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: text-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        position: relative;
      }

      @keyframes text-pulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.5)); }
        50% { opacity: 0.5; filter: drop-shadow(0 0 0px rgba(139, 92, 246, 0)); }
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(1.05); /* Slight zoom out when fading */
      }
    </style>
  </head>
  <body>
    <!-- Premium Loading Screen -->
    <div id="loading-screen">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">AJNISH</div>
      </div>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      // Hide loading screen when page loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
              loadingScreen.remove();
            }, 500);
          }
        }, 1000);
      });
      
      // Remove Service Worker in dev mode to fix caching issues
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
              console.log('Unregistered old service worker to fix caching issues.');
            }
          });
        });
      }
    </script>
    
    <!-- Main React App Script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
